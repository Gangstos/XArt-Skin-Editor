name: Release

# Pushing a tag like v1.0.0 builds every platform on its native runner and creates a DRAFT release
# with the archives attached. Review the draft, then publish it. "Run workflow" builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,    archive: zip }
          - { os: ubuntu-latest,  rid: linux-x64,  archive: tar.gz }
          - { os: macos-latest,   rid: osx-arm64,  archive: tar.gz }
          - { os: macos-latest,   rid: osx-x64,    archive: tar.gz }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: >
          dotnet publish XArtSkinEditor.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Show what was produced
        shell: bash
        run: |
          ls -la publish
          if [ "${{ runner.os }}" = "macOS" ]; then codesign -dv publish/XArtSkinEditor || true; fi

      # Linux only: start the real app on a virtual display and ask its MCP server for the tool list.
      - name: Smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libice6 libsm6 libfontconfig1 libicu-dev
          export XART_DATA_DIR="$RUNNER_TEMP/xart-data"
          xvfb-run -a ./publish/XArtSkinEditor --mcp-port 5199 > app.log 2>&1 &
          sleep 20
          COUNT=$(curl -s -X POST http://127.0.0.1:5199/mcp \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -o '"name":"[a-z_]*"' | wc -l)
          echo "MCP tools reported by the running Linux build: $COUNT"
          echo "--- app.log"; cat app.log || true
          pkill -f XArtSkinEditor || true
          test "$COUNT" -eq 27

      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev"; fi
          NAME="XArtSkinEditor-$VERSION-${{ matrix.rid }}"
          mkdir -p "dist/$NAME"
          cp -R publish/. "dist/$NAME/"
          # Debug symbols of the native libraries (~100 MB) are not needed to run the app.
          find "dist/$NAME" -name '*.pdb' -delete
          cp LICENSE "dist/$NAME/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
          else
            chmod +x "dist/$NAME/XArtSkinEditor"
            (cd dist && tar -czf "$NAME.tar.gz" "$NAME")
          fi
          rm -rf "dist/$NAME"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "XArt Skin Editor $GITHUB_REF_NAME" \
            --notes "Release notes are being finalized."
